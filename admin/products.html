<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Produk — Muhun Leather Admin</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <!-- Loading Guard -->
  <div id="auth-loading" class="auth-loading">
    <div class="spinner" aria-label="Loading"></div>
    <p>Memeriksa autentikasi...</p>
  </div>

  <div id="admin-app" class="admin-app" style="display:none">
    <!-- Admin Header -->
    <header class="admin-header">
      <div class="admin-header-inner container">
        <a href="index.html" class="logo-link">
          <span class="logo-text">MUHUN LEATHER</span>
        </a>
        <div class="admin-header-right">
          <span id="admin-user-name" class="admin-user-name">Admin</span>
          <button id="logout-btn" class="btn btn-outline admin-logout-btn">Keluar</button>
        </div>
      </div>
    </header>

    <!-- Admin Nav -->
    <nav class="admin-nav">
      <div class="container">
        <a href="index.html" class="admin-nav-link">Dashboard</a>
        <a href="products.html" class="admin-nav-link active">Produk</a>
        <a href="settings.html" class="admin-nav-link">Pengaturan</a>
      </div>
    </nav>

    <main class="admin-main">
      <div class="container">
        <p id="products-message" class="form-message" role="status" style="display:none">Produk berhasil disimpan.</p>
        <div class="admin-page-header">
          <h1 class="admin-page-title">Daftar Produk</h1>
          <a href="product-form.html" class="btn btn-primary">+ Tambah Produk</a>
        </div>

        <!-- Product Table -->
        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Nama Produk</th>
                  <th>Kategori</th>
                  <th>Harga (IDR)</th>
                  <th>Diskon</th>
                  <th>Total Stok</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="products-table-body">
                <tr><td colspan="8" style="text-align:center; padding: 32px;">Memuat produk...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/admin/products.js"></script>
</body>
</html>
