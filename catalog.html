<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog — Muhun Leather</title>
  <meta name="description" content="Jelajahi koleksi tas, sepatu, dan sandal kulit wanita dari Muhun Leather">

  <!-- Open Graph -->
  <meta property="og:title" content="Katalog — Muhun Leather">
  <meta property="og:description" content="Jelajahi koleksi tas, sepatu, dan sandal kulit wanita dari Muhun Leather">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">MUHUN LEATHER</span>
      </a>
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Beranda</a>
        <a href="catalog.html" class="nav-link active" data-i18n="nav.catalog">Katalog</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="id">ID</button>
          <span class="lang-divider">|</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <!-- Mobile Menu -->
    <nav class="mobile-menu">
      <a href="index.html" class="nav-link" data-i18n="nav.home">Beranda</a>
      <a href="catalog.html" class="nav-link active" data-i18n="nav.catalog">Katalog</a>
    </nav>
  </header>

  <main>
    <!-- Catalog Section -->
    <section class="section catalog-section">
      <div class="container">
        <!-- Title & Product Count -->
        <div class="catalog-header">
          <h1 class="section-title" data-i18n="catalog.title">Katalog Produk</h1>
          <p class="product-count" id="product-count">
            <span data-i18n="catalog.showing">Menampilkan</span>
            <span id="count-value">0</span>
            <span data-i18n="catalog.products">produk</span>
          </p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <!-- Category Chips -->
          <div class="category-chips" role="tablist" aria-label="Filter kategori">
            <button class="chip active" data-category="all" role="tab" aria-selected="true" data-i18n="catalog.filter.all">Semua</button>
            <button class="chip" data-category="tas" role="tab" aria-selected="false" data-i18n="category.tas">Tas</button>
            <button class="chip" data-category="sepatu" role="tab" aria-selected="false" data-i18n="category.sepatu">Sepatu</button>
            <button class="chip" data-category="sandal" role="tab" aria-selected="false" data-i18n="category.sandal">Sandal</button>
          </div>

          <!-- Search & Sort -->
          <div class="filter-controls">
            <div class="search-input-wrap">
              <label for="search-input" class="sr-only" data-i18n="catalog.search.label">Cari produk</label>
              <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Cari produk..."
                data-i18n-placeholder="catalog.search.placeholder"
                autocomplete="off"
              >
              <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>

            <div class="sort-wrap">
              <label for="sort-select" class="sr-only" data-i18n="catalog.sort.label">Urutkan</label>
              <select id="sort-select" class="sort-select">
                <option value="newest" data-i18n="catalog.sort.newest">Terbaru</option>
                <option value="price-asc" data-i18n="catalog.sort.price_asc">Harga: Rendah ke Tinggi</option>
                <option value="price-desc" data-i18n="catalog.sort.price_desc">Harga: Tinggi ke Rendah</option>
                <option value="name-asc" data-i18n="catalog.sort.name_asc">Nama: A–Z</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="product-grid">
          <!-- Populated by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display:none">
          <p data-i18n="catalog.empty">Tidak ada produk ditemukan.</p>
        </div>

        <!-- Pagination -->
        <nav id="pagination" class="pagination" aria-label="Pagination">
          <!-- Populated by JS -->
        </nav>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner container">
      <div class="footer-col">
        <span class="footer-logo">MUHUN LEATHER</span>
        <p class="footer-tagline" data-i18n="site.tagline">Kulit pilihan, langkah percaya diri</p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.catalog">Katalog</h4>
        <a href="catalog.html?category=tas" data-i18n="category.tas">Tas</a>
        <a href="catalog.html?category=sepatu" data-i18n="category.sepatu">Sepatu</a>
        <a href="catalog.html?category=sandal" data-i18n="category.sandal">Sandal</a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.contact">Kontak</h4>
        <a id="footer-shopee" href="#" target="_blank" rel="noopener noreferrer">Shopee</a>
        <a id="footer-tiktok" href="#" target="_blank" rel="noopener noreferrer">TikTok Shop</a>
      </div>
    </div>
    <div class="footer-bottom container">
      <p data-i18n="footer.copyright">© 2024 Muhun Leather. Hak cipta dilindungi.</p>
      <a href="admin/login.html" class="discreet-admin-link" title="Staff Login" aria-label="Staff Login">🔒 Staff</a>
    </div>
  </footer>

  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
